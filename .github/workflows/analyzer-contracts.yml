name: Analyzer contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -o addopts='' -q scripts/test_analyzer.py
      - run: python -m pytest -o addopts='' -q scripts/test_panel.py
      - run: python -m pytest -o addopts='' -q scripts/test_visual.py
      - run: python -m pytest -o addopts='' -q scripts/test_reconcile.py
      - run: python -m pytest -o addopts='' -q scripts/test_solver.py
      - run: python -m scripts.dragon_analyzer.solver
      - run: python -m pytest -o addopts='' -q scripts/test_battle.py
      - run: python -m scripts.dragon_analyzer.battle
      - run: python -m pytest -o addopts='' -q scripts/test_supervisor.py
      - run: python -m pytest -o addopts='' -q scripts/test_release.py
      - run: python -m scripts.dragon_analyzer.release
      - run: python -m quality.measure_release
      - run: python -m pytest -o addopts='' -q scripts/test_mutation_runner.py
      - run: python -m pytest -o addopts='' -q scripts/test_runtime_bridge.py
      - run: python -m pytest -o addopts='' -q scripts/test_icons.py
      - run: python -m pytest -o addopts='' -q scripts/test_ledger.py
      - run: python -m pytest -o addopts='' -q scripts/test_tactical.py
      - run: python -m scripts.dragon_analyzer.tactical
      - run: python -m pytest -o addopts='' -q scripts/test_combat.py
      - run: python -m scripts.dragon_analyzer.combat
      - run: python -m pytest -o addopts='' -q scripts/test_strategy.py
      - run: python -m scripts.dragon_analyzer.strategy
      - run: python -m pytest -o addopts='' -q scripts/test_certification.py
      - run: dragonfire --help
      - run: python quality/replay_legacy_red.py
      - run: python -m quality.mutation_runner --output '${{ runner.temp }}/mutation-report.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-${{ matrix.python }}
          path: ${{ runner.temp }}/mutation-report.json
          if-no-files-found: warn
  certification:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-report-*
          path: ${{ runner.temp }}/cert-evidence
      - run: python -m scripts.dragon_analyzer.certification --reports "${{ runner.temp }}/cert-evidence/mutation-report-3.11/mutation-report.json" "${{ runner.temp }}/cert-evidence/mutation-report-3.12/mutation-report.json" --output "${{ runner.temp }}/certification.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certification-report
          path: ${{ runner.temp }}/certification.json
          if-no-files-found: warn
