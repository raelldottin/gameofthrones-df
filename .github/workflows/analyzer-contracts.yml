name: Analyzer contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install opencv-python pytesseract pillow numpy 'pydantic>=2.5,<3' typer rich loguru pytest pytest-cov
      - run: python -m pytest -o addopts='' -q scripts/test_analyzer.py
